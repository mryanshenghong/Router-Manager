<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="routerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- WiFi wave signals (top) -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Outer wave -->
    <path d="M 160 170 A 136 136 0 0 1 352 170" stroke-width="18" stroke-opacity="0.5" />
    <!-- Middle wave -->
    <path d="M 195 205 A 86 86 0 0 1 317 205" stroke-width="18" stroke-opacity="0.8" />
    <!-- Inner wave -->
    <path d="M 230 240 A 36 36 0 0 1 282 240" stroke-width="18" stroke-opacity="1" />
  </g>

  <!-- Router Device Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Antennas -->
    <!-- Left Antenna -->
    <path d="M 170 310 L 120 180" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
    <circle cx="120" cy="180" r="10" fill="#38bdf8" />

    <!-- Center Left Antenna -->
    <path d="M 220 310 L 205 160" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
    <circle cx="205" cy="160" r="10" fill="#38bdf8" />

    <!-- Center Right Antenna -->
    <path d="M 292 310 L 307 160" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
    <circle cx="307" cy="160" r="10" fill="#38bdf8" />

    <!-- Right Antenna -->
    <path d="M 342 310 L 392 180" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
    <circle cx="392" cy="180" r="10" fill="#38bdf8" />

    <!-- Router Main Chassis -->
    <rect x="96" y="300" width="320" height="92" rx="28" fill="url(#routerBodyGrad)" />
    
    <!-- Dark glossy display bar -->
    <rect x="120" y="326" width="272" height="40" rx="12" fill="#0f172a" />
    
    <!-- LED Indicators -->
    <!-- Power LED (Green) -->
    <circle cx="160" cy="346" r="6" fill="#22c55e" filter="url(#glow)" />
    <!-- Internet LED (Blue) -->
    <circle cx="208" cy="346" r="6" fill="#38bdf8" filter="url(#glow)" />
    <!-- 2.4G WiFi LED (Blue) -->
    <circle cx="256" cy="346" r="6" fill="#38bdf8" />
    <!-- 5G WiFi LED (Blue) -->
    <circle cx="304" cy="346" r="6" fill="#38bdf8" />
    <!-- LAN Activity LED (Amber) -->
    <circle cx="352" cy="346" r="6" fill="#f59e0b" />
  </g>
</svg>
